<!DOCTYPE html>
<html>
<head>
  <title>Braid-Text HedgeDoc Test Editor</title>
  <style>
    body { font-family: sans-serif; margin: 1em; }
    .editors { display: flex; gap: 1em; }
    .editor-pane { flex: 1; }
    .editor-pane sync-area { width: 100%; height: 400px; font-family: monospace; font-size: 14px; }
    .editor-pane h3 { margin: 0 0 0.5em 0; }
  </style>
</head>
<body>
  <h2>Braid-Text HedgeDoc Test Editor</h2>

  <div class="editors">
    <div class="editor-pane">
      <h3>Client A</h3>
      <sync-area id="editorA" accept="text/plain"></sync-area>
    </div>
    <div class="editor-pane">
      <h3>Client B</h3>
      <sync-area id="editorB" accept="text/plain"></sync-area>
    </div>
  </div>

  <!-- Braid dependencies, pinned to specific versions -->
  <script src="https://unpkg.com/braid-http@~1.3/braid-http-client.js"></script>
  <script src="https://unpkg.com/braid-text@~0.5/client/myers-diff.js"></script>
  <script src="https://unpkg.com/braid-text@~0.5/client/text-client.js"></script>
  <script src="https://unpkg.com/braid-text@~0.5/client/simpleton.js"></script>
  <script src="https://unpkg.com/braid-text@~0.5/client/textarea-highlights.js"></script>
  <script src="https://unpkg.com/braid-text@~0.5/client/cursor-sync.js"></script>
  <script src="https://unpkg.com/braid-text@~0.5/client/syncarea.js"></script>

  <script>
    var params = new URLSearchParams(location.search)
    var alias = params.get('alias') || 'test-doc'
    var token = (params.get('token') || '').replace(/\s+/g, '')
    var src = '/api/v2/notes/' + alias + '/content'

    document.title = 'Braid Test: ' + alias

    for (var id of ['editorA', 'editorB']) {
      var el = document.getElementById(id)
      el.setAttribute('src', src)
      if (token) el.setAttribute('bearer', token)
    }
  </script>
</body>
</html>
