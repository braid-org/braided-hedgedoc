<!DOCTYPE html>
<html>
<head>
  <title>Braid-Text HedgeDoc Test Editor</title>
  <style>
    body { font-family: sans-serif; margin: 1em; }
    .editors { display: flex; gap: 1em; }
    .editor-pane { flex: 1; }
    .editor-pane textarea { width: 100%; height: 400px; font-family: monospace; font-size: 14px; box-sizing: border-box; }
    .editor-pane h3 { margin: 0 0 0.5em 0; }
    .status { font-family: monospace; font-size: 11px; color: #666; margin-top: 0.3em; }
  </style>
</head>
<body>
  <h2>Braid-Text HedgeDoc Test Editor</h2>

  <div class="editors">
    <div class="editor-pane">
      <h3>Client A</h3>
      <textarea id="editorA"></textarea>
      <div class="status" id="statusA">Connecting...</div>
    </div>
    <div class="editor-pane">
      <h3>Client B</h3>
      <textarea id="editorB"></textarea>
      <div class="status" id="statusB">Connecting...</div>
    </div>
  </div>

  <!-- Braid dependencies -->
  <script src="https://braid.org/code/myers-diff1.js"></script>
  <script src="https://unpkg.com/braid-http@~1.3/braid-http-client.js"></script>
  <script src="/public/simpleton-sync.js"></script>

  <script>
    var params = new URLSearchParams(location.search)
    var alias = params.get('alias') || 'test-doc'
    var token = (params.get('token') || '').replace(/\s+/g, '')
    var url = location.origin + '/api/v2/notes/' + alias + '/content'

    document.title = 'Braid Test: ' + alias

    function connectEditor(editorId, statusId, peerName) {
      var editor = document.getElementById(editorId)
      var status = document.getElementById(statusId)

      if (!token) {
        status.textContent = 'No token — add ?token=...&alias=... to URL'
        return
      }

      var sync = simpleton_client(url, {
        get_state: () => editor.value,
        on_state: (state) => { editor.value = state },
        headers: {
          'Authorization': 'Bearer ' + token,
          'Peer': peerName
        },
        content_type: 'text/plain',
        on_error: (e) => {
          status.textContent = 'Error: ' + e
          console.error(peerName + ' error:', e)
        }
      })

      editor.addEventListener('input', () => sync.changed())
      status.textContent = 'Connected as ' + peerName + ' to ' + url
    }

    // Connect both editors with different peer IDs
    connectEditor('editorA', 'statusA', 'client-a')
    connectEditor('editorB', 'statusB', 'client-b')
  </script>
</body>
</html>
