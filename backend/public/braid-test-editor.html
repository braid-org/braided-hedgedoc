<!DOCTYPE html>
<html>
<head>
  <title>Braid-Text HedgeDoc Test Editor</title>
  <style>
    body { font-family: sans-serif; margin: 1em; }
    .editors { display: flex; gap: 1em; }
    .editor-pane { flex: 1; position: relative; }
    .editor-pane textarea { width: 100%; height: 400px; font-family: monospace; font-size: 14px; box-sizing: border-box; }
    .editor-pane h3 { margin: 0 0 0.5em 0; }
    .status { font-family: monospace; font-size: 11px; color: #666; margin-top: 0.3em; }
  </style>
</head>
<body>
  <h2>Braid-Text HedgeDoc Test Editor</h2>

  <div class="editors">
    <div class="editor-pane">
      <h3>Client A</h3>
      <textarea id="editorA" disabled></textarea>
      <div class="status" id="statusA">Connecting...</div>
    </div>
    <div class="editor-pane">
      <h3>Client B</h3>
      <textarea id="editorB" disabled></textarea>
      <div class="status" id="statusB">Connecting...</div>
    </div>
  </div>

  <!-- Braid dependencies -->
  <script src="https://braid.org/code/myers-diff1.js"></script>
  <script src="https://unpkg.com/braid-http@~1.3/braid-http-client.js"></script>
  <script src="/public/web-utils.js"></script>
  <script src="/public/simpleton-sync.js"></script>
  <script src="/public/textarea-highlights.js"></script>
  <script src="/public/cursor-sync.js"></script>

  <script>
    var params = new URLSearchParams(location.search)
    var alias = params.get('alias') || 'test-doc'
    var token = (params.get('token') || '').replace(/\s+/g, '')
    var url = location.origin + '/api/v2/notes/' + alias + '/content'

    document.title = 'Braid Test: ' + alias

    function connectEditor(editorId, statusId) {
      var editor = document.getElementById(editorId)
      var status = document.getElementById(statusId)

      if (!token) {
        status.textContent = 'No token — add ?token=...&alias=... to URL'
        return
      }

      // Set up cursor sync and rendering
      var cursors = cursor_highlights(editor, url, {
        headers: { 'Authorization': 'Bearer ' + token }
      })

      var sync = simpleton_client(url, {
        headers: { 'Authorization': 'Bearer ' + token },
        content_type: 'text/plain',

        on_online: (online) => {
          status.textContent = online ? 'Connected' : 'Reconnecting...'
          online ? cursors.online() : cursors.offline()
        },

        // Use on_patches for incremental updates (needed for cursor tracking)
        on_patches: (patches) => {
          editor.disabled = false
          apply_patches_and_update_selection(editor, patches)
          cursors.on_patches(patches)
        },

        get_patches: (prev_state) => diff(prev_state, editor.value),
        get_state: () => editor.value,

        on_error: (e) => {
          set_error_state(editor)
          status.textContent = 'Error: ' + e
          console.error(editorId + ' error:', e)
        },
        on_ack: () => set_acked_state(editor)
      })

      editor.oninput = () => {
        set_acked_state(editor, false)
        cursors.on_edit(sync.changed())
      }

      status.textContent = 'Connecting to ' + url + '...'
    }

    connectEditor('editorA', 'statusA')
    connectEditor('editorB', 'statusB')
  </script>
</body>
</html>
